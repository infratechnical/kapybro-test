settings:

maintainers: # Will be used for assignment, find the usages lower
  teams: [ "maintainers" ]
  users: [ "farnsworth", "haarolean" ]

triage:
  label: "status/triage" # Define triage status label to be operated by the app
  remove-assignees: true # Remove all the assignees present upon issue creation

  skip: # skip an automated triage process based on configured conditions
    enabled: true
    remove-triage-labels: true
    do-manual-triage: true # request a manual triage if an automated one has been skipped
    add-labels: [ "status/triage/skipped" ]
    conditions:
      labels: [ "needs-attention", "needs-discussion" ] # skip triage if at least one of the labels is present
      authors: # OR an issue/pr has been opened by someone defined
        teams: [ "maintainers" ]
        users: [ "farnsworth", "zoidberg" ]
    comment:
      enabled: true
      message: "Automated triaging skipped."

  manual: # schedule a human maintainer triaging after an automated one
    enabled: true
    add-labels: [ "status/triage/manual" ]
    assign-maintainers: true # Assign one maintainer from maintainer list upon manual triage
    comment:
      enabled: true
      message: "Automated triaging completed. Pending human maintainer 🤖"

  repeating: # do an automatic triage again based on configured events (like adding a triage label again)
    enabled: true
    trigger-by-triage-labels: true # do a re-triage upon defined known triaging labels
    only-manual: true # skip right to the manual triaging stage upon repeated triaging
    conditions:
      labels: [ "status/re-triage" ] # additional labels to consider

  completed: # actions to do upon completing automated triaging
    add-labels: [ "status/triage/completed" ]
    remove-labels: [ "needs-attention" ]


label-groups: #custom list of groups of labels with weights
  - name: priority # priority is a well-known weight type, we'll use it for our internal issue weight balancing
    weights:
      - priority/high: 3
      - priority/medium: 2
      - priority/low: 1

  - name: severity # severity is a well-known weight type, we'll use it for our internal issue weight balancing
    weights:
      - severity/blocker: 10
      - severity/critical: 5
      - severity/high: 3
      - severity/medium: 2
      - severity/low: 1

  - name: issue-type # a custom user-defined type
    weights:
      - type/security: 10
      - type/cve: 10
      - type/dependencies: 2
    rules: # we'll assign the labels based on the weight of the issue
      - ">=10": [ "priority/high" ]
      - "<10": [ "priority/low" ]

cross-linking: # Add labels to issues/prs if a pr/issue has been linked
  enabled: true
  issues: # Add labels to the issue when linked with a PR
    labels: [ "meta/has-pr" ]
  prs: # Add labels to the PR when linked with an issue
    labels: [ "meta/has-issue" ]

labeling: # We'll assign labels based on the issue/pr template rules elements' id's you've defined
  enabled: true
  case-sensitive: false
  match-title: true
  match-body: true
  rules:
    # <keyword>: <label>
    - backend: scope/backend
    - frontend: scope/frontend
    - infra: scope/infrastructure
    - bug: type/bug
    - feature: type/feature

feedback-management:
  enabled: true
  labels:
    requested: "status/feedback-requested"
    received: "status/feedback-received"
  only-author-replies: true
  assign-author: true
  assign-maintainers: true # Assign one maintainer from maintainer list upon receiving feedback
  comments:
    requested: "Further user feedback is requested. Please reply within 7 days or we might close the issue."
    received: "Thanks for the additional feedback! We'll get back to your issue soon."

locking:
  enabled: true
  lock-on-close: true
  lock-on-label: true
  labels: [ "status/too-heated" ]
  comment:
    enabled: true
    message: "Thanks for the interest in this issue. Please, raise a new one or open up a discussion! Thanks"
