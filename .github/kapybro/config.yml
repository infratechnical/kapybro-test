settings:

maintainers: 
  teams: [ "maintainers" ]
  users: [ "farnsworth", "zoidberg" ]

triage:
  enabled: true

  label: "status/triage" 
  remove-assignees: true 

  skip: 
    enabled: true
    remove-triage-labels: true
    do-manual-triage: true 
    labels:
      add: [ "status/triage/skipped" ]
      remove: [ ]
    conditions:
      labels: [ "needs-attention", "needs-discussion" ] 
      authors: 
        teams: [ "maintainers" ]
        users: [ "farnsworth", "haarolean" ]
    comment:
      enabled: true
      message: "Automated triaging skipped."

  manual: 
    enabled: true
    label: "status/triage/manual" 
    labels:
      add: []
      remove: []
    assign-maintainers: true
    comment:
      enabled: true
      message: "Automated triaging completed. Pending human maintainer 🤖"

  repeating:
    enabled: true
    trigger-by-triage-labels: true
    only-manual: false
    conditions:
      labels: [ "status/re-triage" ]

  completed: 
    labels:
      add: [ "status/triage/completed" ]
      remove: [ "needs-attention" ]

label-groups: 
  - name: priority
    weights:
      - priority/high: 3
      - priority/medium: 2
      - priority/low: 1

  - name: severity 
    weights:
      - severity/blocker: 10
      - severity/critical: 5
      - severity/high: 3
      - severity/medium: 2
      - severity/low: 1

  - name: issue-type
    weights:
      - type/security: 10
      - type/cve: 10
      - type/dependencies: 2
    rules: 
      - ">=10": [ "priority/high" ]
      - "<10": [ "priority/low" ]

keyword-labeling: 
  enabled: true
  case-sensitive: false
  match-title: true
  match-body: true
  rules:
    - backend: scope/backend
    - frontend: scope/frontend
    - infra: scope/infrastructure
    - bug: type/bug
    - feature: type/feature

feedback-management:
  enabled: true
  labels:
    requested: "status/feedback-requested"
    received: "status/feedback-received"
  only-author-replies: false
  assign-author: true
  assign-maintainers: true
  comments:
    requested: "Further user feedback is requested. Please reply within 7 days or we might close the issue."
    received: "Thanks for the additional feedback! We'll get back to your issue soon."
    closed: "No feedback received within 7 days. Auto closing."
  auto-close:
    enabled: true
    close-days: 7
    labels:
      add: [ "status/stale" ]
      remove: [ "status/feedback-requested" ]

locking:
  enabled: true
  lock-on-close: true
  lock-on-label: true
  labels: [ "status/too-heated" ]
  comment:
    enabled: true
    message: "Thanks for the interest in this issue. Please, raise a new one or open up a discussion! Thanks"

auto-rebase:
  enabled: true
  rebase-on-label: true
  labels: [ "status/auto-merge" ]
