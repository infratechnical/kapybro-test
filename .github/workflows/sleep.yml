name: Sleep for 1 min

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  sleep_job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Sleep for 1 min
      run: |
        echo "Sleeping for 1 min..."
        sleep 1m
        echo "Finished sleeping"
